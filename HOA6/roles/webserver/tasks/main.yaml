---
- name: Install apache2 (Ubuntu)
  tags: apache, web, ubuntu
  apt:
    name: apache2
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Start apache2 (Ubuntu)
  tags: apache, web, ubuntu
  service:
    name: apache2
    state: started
    enabled: true
  when: ansible_distribution == "Ubuntu"
