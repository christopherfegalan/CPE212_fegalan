---
- name: Deploy Nginx and Monitoring Tool in Ubuntu & CentOS
  hosts: all
  become: yes
  vars_files:
    - config.yaml

  tasks:
    - name: Install Nginx (Ubuntu)
      apt:
        name: nginx
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install EPEL release and Nginx (CentOS)
      dnf:
        name:
          - epel-release
          - nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Create Node Exporter user
      user:
        name: node_exporter
        shell: /sbin/nologin
        system: yes

    - name: Download Node Exporter binary archive
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"

    - name: Extract Node Exporter archive
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/tmp/"
        remote_src: yes

    - name: Copy Node Exporter binary to /usr/local/bin
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: "/usr/local/bin/node_exporter"
        mode: '0755'
        remote_src: yes

    - name: Create systemd service for Node Exporter
      copy:
        dest: "/etc/systemd/system/node_exporter.service"
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=default.target

    - name: Start and enable Node Exporter service
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes

    - name: Set MOTD message
      copy:
        dest: /etc/motd
        content: "Ansible Managed by {{ motd_username }}\n"
        mode: '0644'
