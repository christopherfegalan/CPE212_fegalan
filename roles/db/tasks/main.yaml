---
- name: Install mariadb-server (Ubuntu)
  tags: db, mariadb, ubuntu
  apt:
    name: mariadb-server
    state: present
    update_cache: yes
  when: ansible_distribution == "Ubuntu"

- name: Start mariadb (Ubuntu)
  tags: db, mariadb, ubuntu
  service:
    name: mariadb
    state: started
    enabled: true
  when: ansible_distribution == "Ubuntu"
